name: Shivam CI/CD Pipeline

on:
  push:
    branches:
      - main

jobs:
  greet:
    name: Run
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Greetings!
        run: echo "Hello from Shivam Pal"

      - name: Run Application
        run: |
          echo "Application is running..."
          ls -la

  test:
    name: Test
    runs-on: ubuntu-latest
    needs: greet

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Run Tests
        run: |
          echo "Running tests..."
          test -f index.html
          echo "All tests passed!"

  deploy:
    name: Deploy
    runs-on: ubuntu-latest
    needs: test

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Deploy Application
        run: |
          echo "Deploying application..."
          mkdir -p deploy
          cp index.html deploy/
          echo "Deployment completed successfully!"

      - name: Show Result
        run: echo "CI/CD pipeline completed for Shivam Pal!"

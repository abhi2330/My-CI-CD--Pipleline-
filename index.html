
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Welcome | CI/CD Pipeline</title>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: Arial, sans-serif;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            color: white;
            background: linear-gradient(135deg, #0f172a, #1e3a8a, #312e81);
        }

        .container {
            width: 90%;
            max-width: 750px;
            padding: 50px 30px;
            text-align: center;
            border: 1px solid rgba(255,255,255,0.2);
            border-radius: 20px;
            background: rgba(255,255,255,0.08);
            box-shadow: 0 20px 60px rgba(0,0,0,0.3);
        }

        .icon {
            font-size: 60px;
            margin-bottom: 20px;
        }

        h1 {
            font-size: clamp(30px, 6vw, 46px);
            margin-bottom: 15px;
        }

        h1 span {
            color: #38bdf8;
        }

        p {
            color: #cbd5e1;
            font-size: 17px;
            line-height: 1.7;
            margin-bottom: 25px;
        }

        .status {
            display: inline-block;
            padding: 10px 18px;
            border-radius: 30px;
            color: #86efac;
            background: rgba(34,197,94,0.15);
            border: 1px solid #22c55e;
            margin-bottom: 25px;
        }

        .pipeline {
            display: flex;
            justify-content: center;
            flex-wrap: wrap;
            gap: 12px;
            margin: 20px 0 30px;
        }

        .step {
            padding: 12px 16px;
            border-radius: 10px;
            background: rgba(255,255,255,0.1);
            font-size: 14px;
        }

        .footer {
            margin-top: 25px;
            font-size: 13px;
            color: #94a3b8;
        }

        .button {
            display: inline-block;
            padding: 13px 25px;
            border-radius: 8px;
            text-decoration: none;
            color: #0f172a;
            background: #38bdf8;
            font-weight: bold;
            transition: 0.3s;
        }

        .button:hover {
            background: #7dd3fc;
            transform: translateY(-2px);
        }
    </style>
</head>

<body>
    <main class="container">
        <div class="icon">🚀</div>

        <h1>Welcome to <span>CI/CD</span></h1>

        <p>
            Congratulations! Your application is ready.<br>
            Build, Test, Deploy — Automate Everything.
        </p>

        <div class="status">
            ● Application Running
        </div>

        <div class="pipeline">
            <div class="step">✓ Code</div>
            <div class="step">✓ Build</div>
            <div class="step">✓ Test</div>
            <div class="step">✓ Deploy</div>
        </div>

        <a href="#" class="button"
           onclick="alert('Welcome to your CI/CD application!')">
            Get Started
        </a>

        <div class="footer">
            Powered by DevOps Automation | CI/CD Pipeline
            <br><br>
            &copy; 2026 Your Organization
        </div>
    </main>
</body>
</html>
